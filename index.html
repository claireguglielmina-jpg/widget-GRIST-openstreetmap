
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des établissements et transports</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { height: 100%; width: 100%; background: #e8e6e0; }

  .panel {
    background: rgba(255, 255, 255, .96);
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .3);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #222;
  }
  .info { max-width: 260px; }
  .info .nom { font-weight: 600; font-size: 13.5px; }
  .info .hint { color: #555; }
  .info .err { color: #b3261e; }

  .legend { min-width: 190px; }
  .legend h4 { margin: 0 0 5px; font-size: 12.5px; font-weight: 600; }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend .row .n { margin-left: auto; color: #777; font-variant-numeric: tabular-nums; }
  .legend hr { border: 0; border-top: 1px solid #ddd; margin: 6px 0; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); flex: none; box-sizing: border-box; }
  .legend .ico { width: 20px; text-align: center; flex: none; font-size: 14px; }

  /* Icônes des transports */
  .tp {
    width: 26px; height: 26px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 50%;
    font-size: 14px; line-height: 1;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
  }
  .tp-gare { border: 2px solid #b3261e; }
  .tp-bus  { border: 2px solid #0b5cad; }

  .prefetch { max-width: 230px; }
  .pf-btn { font: inherit; font-size: 12.5px; padding: 5px 9px; border: 1px solid #bbb; border-radius: 5px; background: #fff; cursor: pointer; color: #222; width: 100%; }
  .pf-btn:hover:not(:disabled) { background: #f4f4f4; }
  .pf-btn:disabled { color: #888; cursor: default; }
  .pf-status { margin-top: 4px; color: #555; }
  .pf-status:empty { display: none; }

  .leaflet-popup-content { font-size: 13px; }
  .leaflet-popup-content .sub { color: #555; }
  .reset-btn { font-size: 16px; line-height: 30px; text-align: center; text-decoration: none; cursor: pointer; width: 30px; height: 30px; display: block; color: #222; background: #fff; }
  .reset-btn:hover { background: #f4f4f4; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Configuration
   * ------------------------------------------------------------------ */
  const RADIUS_M = 1000; // rayon de zoom et de recherche des transports (en mètres)

  const CACHE_TABLE = 'Cache_Transports'; // table Grist créée automatiquement
  const CACHE_TTL_MS = 90 * 24 * 3600 * 1000; // durée de validité du cache : 90 jours
  const FETCH_TIMEOUT_MS = 12000;     // timeout d’une requête pour un établissement
  const PREFETCH_TIMEOUT_MS = 40000;  // timeout d’une requête de préchargement (plusieurs établissements)
  const PREFETCH_CHUNK = 6;           // établissements interrogés par requête lors du préchargement
  const HEDGE_DELAY_MS = 2500;        // délai avant d’interroger le serveur suivant s’il n’y a pas de réponse

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter'
  ];

  // Catégories d’établissements : libellé de légende + couleur de la puce
  const CATS = {
    college: { label: 'Collège (y c. SEGPA)',      color: '#1f6fd6' }, // bleu
    general: { label: 'Lycée général',             color: '#2e9e44' }, // vert
    pro:     { label: 'Lycée professionnel',       color: '#f28c1b' }, // orange
    poly:    { label: 'Lycée polyvalent',          color: '#8e44ad' }, // violet
    autre:   { label: 'Autre établissement',       color: '#8a8f98' }  // gris
  };

  /**
   * Associe la valeur de la colonne « G » à une catégorie.
   * À adapter ici si besoin.
   */
  function classify(g) {
    const s = String(g || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase();
    if (/POLYVALENT|\bLPO\b/.test(s)) return 'poly';
    if (/PROFESSIONNEL|^LP\b/.test(s)) return 'pro';
    if (/\bLYC/.test(s)) return 'general';
    if (/COLLEGE|SEGPA/.test(s)) return 'college';
    return 'autre';
  }

  /* ------------------------------------------------------------------ *
   *  Utilitaires
   * ------------------------------------------------------------------ */
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function toNum(v) {
    if (typeof v === 'number') return v;
    if (v == null) return NaN;
    return parseFloat(String(v).replace(',', '.').trim());
  }

  function distanceM(lat1, lon1, lat2, lon2) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  /* ------------------------------------------------------------------ *
   *  Carte
   * ------------------------------------------------------------------ */
  const map = L.map('map', { preferCanvas: true }).setView([48.3, 7.5], 8);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">contributeurs OpenStreetMap</a>'
  }).addTo(map);

  const schoolsLayer = L.layerGroup().addTo(map);
  const focusLayer = L.layerGroup().addTo(map);
  const transportLayer = L.layerGroup().addTo(map);

  /* ---- Panneau d’information (haut droite) ---- */
  const infoEl = L.DomUtil.create('div', 'panel info');
  const InfoControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      L.DomEvent.disableClickPropagation(infoEl);
      return infoEl;
    }
  });
  map.addControl(new InfoControl());

  function setInfo(html) { infoEl.innerHTML = html; }
  function setInfoIdle() {
    setInfo('<span class="hint">Cliquez sur une ligne du tableau pour zoomer à 1&nbsp;km autour de l’établissement.</span>');
  }

  /* ---- Légende (bas gauche) ---- */
  const legendEl = L.DomUtil.create('div', 'panel legend');
  const LegendControl = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function () {
      L.DomEvent.disableClickPropagation(legendEl);
      return legendEl;
    }
  });
  map.addControl(new LegendControl());

  function renderLegend(counts) {
    let html = '<h4>Légende</h4>';
    for (const key of Object.keys(CATS)) {
      const n = counts ? counts[key] || 0 : 0;
      if (key === 'autre' && counts && n === 0) continue;
      html += '<div class="row"><span class="dot" style="background:' + CATS[key].color + '"></span>' +
        '<span>' + esc(CATS[key].label) + '</span>' +
        (counts ? '<span class="n">' + n + '</span>' : '') + '</div>';
    }
    html += '<hr>' +
      '<div class="row"><span class="ico">🚂</span><span>Gare</span></div>' +
      '<div class="row"><span class="ico">🚌</span><span>Arrêt de bus ou de tram</span></div>';
    legendEl.innerHTML = html;
  }
  renderLegend(null);

  /* ---- Bouton « vue d’ensemble » (haut gauche, sous le zoom) ---- */
  const ResetControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const bar = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'reset-btn', bar);
      a.href = '#';
      a.title = 'Vue d’ensemble';
      a.setAttribute('role', 'button');
      a.setAttribute('aria-label', 'Vue d’ensemble');
      a.innerHTML = '⤢';
      L.DomEvent.disableClickPropagation(bar);
      L.DomEvent.on(a, 'click', function (e) {
        L.DomEvent.preventDefault(e);
        resetView();
      });
      return bar;
    }
  });
  map.addControl(new ResetControl());

  /* ------------------------------------------------------------------ *
   *  Établissements
   * ------------------------------------------------------------------ */
  let schoolPoints = [];   // [lat, lng] pour la vue d’ensemble
  let schoolsUnique = [];  // établissements distincts (pour le préchargement)
  let current = null;      // établissement sélectionné
  let hasFitAll = false;

  function renderSchools(rows) {
    schoolsLayer.clearLayers();
    schoolPoints = [];
    schoolsUnique = [];
    const seen = new Set();
    const counts = { college: 0, general: 0, pro: 0, poly: 0, autre: 0 };

    for (const r of rows) {
      const key = [r.type, r.nom, r.lat.toFixed(6), r.lng.toFixed(6)].join('|');
      if (seen.has(key)) continue; // le même établissement peut apparaître sur plusieurs lignes
      seen.add(key);

      const cat = classify(r.type);
      counts[cat]++;
      schoolPoints.push([r.lat, r.lng]);
      schoolsUnique.push({ lat: r.lat, lng: r.lng });

      const m = L.circleMarker([r.lat, r.lng], {
        radius: 7,
        color: '#ffffff',
        weight: 1.5,
        fillColor: CATS[cat].color,
        fillOpacity: 0.95
      });
      m.bindTooltip(esc(r.nom || 'Sans nom'), { direction: 'top', offset: [0, -6] });
      m.bindPopup(
        '<b>' + esc(r.nom || 'Sans nom') + '</b><br>' +
        '<span class="sub">' + esc(r.type || '') + '</span>'
      );
      m.on('click', function () {
        try { grist.setCursorPos({ rowId: r.id }); } catch (e) { /* ignoré */ }
      });
      m.addTo(schoolsLayer);
    }

    renderLegend(counts);
    updatePrefetchUI();

    if (!hasFitAll && !current && schoolPoints.length) {
      map.fitBounds(L.latLngBounds(schoolPoints), { padding: [30, 30] });
      hasFitAll = true;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Sélection d’une ligne : zoom à 1 km + transports OSM
   * ------------------------------------------------------------------ */
  function focusOn(s) {
    current = s;
    focusLayer.clearLayers();
    transportLayer.clearLayers();

    const center = [s.lat, s.lng];
    const circle = L.circle(center, {
      radius: RADIUS_M, color: '#222', weight: 2, dashArray: '6 6',
      fillColor: '#4a90e2', fillOpacity: 0.05, interactive: false
    }).addTo(focusLayer);
    L.circleMarker(center, {
      radius: 12, color: '#111', weight: 3, fill: false, interactive: false
    }).addTo(focusLayer);

    map.fitBounds(circle.getBounds(), { padding: [6, 6] });

    const cat = classify(s.type);
    setInfo(
      '<div class="nom">' + esc(s.nom || 'Sans nom') + '</div>' +
      '<div class="hint">' + esc(CATS[cat].label) + '</div>' +
      '<div class="hint">Recherche des transports…</div>'
    );
    scheduleTransport(s);
  }

  function resetView() {
    reqId++;
    if (abortCtrl) abortCtrl.abort();
    clearTimeout(timer);
    current = null;
    focusLayer.clearLayers();
    transportLayer.clearLayers();
    setInfoIdle();
    if (schoolPoints.length) map.fitBounds(L.latLngBounds(schoolPoints), { padding: [30, 30] });
  }

  /* ------------------------------------------------------------------ *
   *  Transports via Overpass (OpenStreetMap) + cache persistant dans Grist
   * ------------------------------------------------------------------ */
  let reqId = 0, abortCtrl = null, timer = null;

  // Cache : clé « lat,lng,rayon » -> liste compacte [code, lat, lon, nom]
  // code : 'g' = gare, 't' = arrêt de tram, 'b' = arrêt de bus
  const cache = new Map();
  const cacheRowIds = new Map();     // clé -> id de ligne dans la table Grist
  let gristCacheOk = false;          // true si la table Grist est utilisable
  let cacheError = '';               // dernier message d’erreur d’accès à la table Grist
  let cacheReady = Promise.resolve();

  const cacheKey = (lat, lng) => lat.toFixed(5) + ',' + lng.toFixed(5) + ',' + RADIUS_M;

  async function initCache() {
    try {
      const tables = await grist.docApi.listTables();
      if (!tables.includes(CACHE_TABLE)) {
        await grist.docApi.applyUserActions([['AddTable', CACHE_TABLE, [
          { id: 'Cle',     type: 'Text' },
          { id: 'Donnees', type: 'Text' },
          { id: 'Maj',     type: 'Numeric' }
        ]]]);
      }
      const t = await grist.docApi.fetchTable(CACHE_TABLE);
      const now = Date.now();
      for (let i = 0; i < t.id.length; i++) {
        const key = t.Cle[i];
        if (!key) continue;
        cacheRowIds.set(key, t.id[i]);
        if (now - (Number(t.Maj[i]) || 0) > CACHE_TTL_MS) continue; // périmé : sera réécrit
        try { cache.set(key, JSON.parse(t.Donnees[i])); } catch (e) { /* ligne ignorée */ }
      }
      gristCacheOk = true;
    } catch (e) {
      cacheError = (e && e.message) ? e.message : String(e);
      console.warn('Cache Grist indisponible (accès « full » requis) :', e);
    }
    updatePrefetchUI();
  }

  /** Mémorise [[clé, items], …] en mémoire puis dans la table Grist (en une seule requête). */
  async function persist(entries) {
    for (const [k, items] of entries) cache.set(k, items);
    updatePrefetchUI();
    if (!gristCacheOk) return;

    const now = Date.now();
    const actions = [], newKeys = [], newData = [];
    for (const [k, items] of entries) {
      const data = JSON.stringify(items);
      const rowId = cacheRowIds.get(k);
      if (rowId) actions.push(['UpdateRecord', CACHE_TABLE, rowId, { Donnees: data, Maj: now }]);
      else { newKeys.push(k); newData.push(data); }
    }
    if (newKeys.length) {
      actions.push(['BulkAddRecord', CACHE_TABLE, newKeys.map(() => null), {
        Cle: newKeys, Donnees: newData, Maj: newKeys.map(() => now)
      }]);
    }
    if (!actions.length) return;
    try {
      const res = await grist.docApi.applyUserActions(actions);
      const ids = res && res.retValues && res.retValues[actions.length - 1];
      if (newKeys.length && Array.isArray(ids)) newKeys.forEach((k, i) => cacheRowIds.set(k, ids[i]));
    } catch (e) {
      cacheError = (e && e.message) ? e.message : String(e);
      gristCacheOk = false;
      console.warn('Écriture du cache Grist impossible :', e);
      updatePrefetchUI();
    }
  }

  function scheduleTransport(s) {
    clearTimeout(timer);
    // Immédiat si déjà en cache ; sinon petit délai pour éviter les requêtes en rafale
    const delay = cache.has(cacheKey(s.lat, s.lng)) ? 0 : 300;
    timer = setTimeout(() => loadTransport(s), delay);
  }

  async function loadTransport(s) {
    const id = ++reqId;
    if (abortCtrl) abortCtrl.abort();
    const key = cacheKey(s.lat, s.lng);

    try {
      await cacheReady;
      if (id !== reqId) return;
      let items = cache.get(key);
      const fromCache = !!items;
      if (!items) {
        abortCtrl = new AbortController();
        const elements = await queryOverpass([[s.lat, s.lng]], abortCtrl.signal, FETCH_TIMEOUT_MS);
        items = parseElements(elements);
        persist([[key, items]]); // sans attendre : l’affichage passe en premier
      }
      if (id !== reqId) return;
      drawTransport(items, s, fromCache);
    } catch (e) {
      if (id !== reqId || (e && e.name === 'AbortError')) return;
      const cat = classify(s.type);
      setInfo(
        '<div class="nom">' + esc(s.nom || 'Sans nom') + '</div>' +
        '<div class="hint">' + esc(CATS[cat].label) + '</div>' +
        '<div class="err">Impossible de charger les gares et arrêts depuis OpenStreetMap. Cliquez à nouveau sur la ligne pour réessayer.</div>'
      );
    }
  }

  function buildQuery(points) {
    let body = '';
    for (const p of points) {
      const a = '(around:' + RADIUS_M + ',' + p[0] + ',' + p[1] + ')';
      body += 'nw["railway"~"^(station|halt)$"]' + a + ';' +
              'node["railway"="tram_stop"]' + a + ';' +
              'node["highway"="bus_stop"]' + a + ';';
    }
    return '[out:json][timeout:25];(' + body + ');out center tags qt;';
  }

  function abortError() {
    const err = new Error('Aborted');
    err.name = 'AbortError';
    return err;
  }

  /** Une requête vers un serveur, démarrée après `delay` ms, avec timeout propre. */
  function fetchOne(url, q, signal, delay, timeoutMs) {
    const ctrl = new AbortController();
    const onAbort = () => ctrl.abort();
    if (signal) {
      if (signal.aborted) ctrl.abort();
      else signal.addEventListener('abort', onAbort, { once: true });
    }
    let to = null;
    const promise = (async () => {
      if (delay) await new Promise((r) => setTimeout(r, delay));
      if (ctrl.signal.aborted) throw abortError();
      to = setTimeout(() => ctrl.abort(), timeoutMs);
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      // Overpass répond parfois 200 avec une remarque d’erreur et aucun résultat
      if (json.remark && !(json.elements && json.elements.length) && /error|timed out|out of memory/i.test(json.remark)) {
        throw new Error(json.remark);
      }
      return json.elements || [];
    })().finally(() => {
      clearTimeout(to);
      if (signal) signal.removeEventListener('abort', onAbort);
    });
    return { promise: promise, abort: () => ctrl.abort() };
  }

  /**
   * Interroge les serveurs Overpass « en course » : le premier part tout de suite,
   * les suivants démarrent seulement s’il n’a pas répondu au bout de quelques secondes.
   * Le premier qui répond gagne, les autres sont annulés.
   */
  async function queryOverpass(points, signal, timeoutMs) {
    const q = buildQuery(points);
    const jobs = OVERPASS_ENDPOINTS.map((url, i) =>
      fetchOne(url, q, signal, i * HEDGE_DELAY_MS, timeoutMs));
    try {
      return await Promise.any(jobs.map((j) => j.promise));
    } catch (e) {
      if (signal && signal.aborted) throw abortError();
      // Échec réseau / timeout / HTTP : on le renvoie sous un nom qui n'est PAS « AbortError »,
      // sinon il serait pris pour une annulation volontaire.
      const errs = (e && e.errors) || [];
      const real = errs.find((x) => x && x.name !== 'AbortError') || errs[0];
      const msg = real ? (real.name === 'AbortError' ? 'délai dépassé' : real.message) : 'Overpass indisponible';
      const err = new Error(msg);
      err.name = 'OverpassError';
      throw err;
    } finally {
      jobs.forEach((j) => j.abort());
    }
  }

  /** Convertit la réponse Overpass en liste compacte [code, lat, lon, nom], sans doublons de gares. */
  function parseElements(elements) {
    const items = [];
    for (const el of elements) {
      const t = el.tags || {};
      const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
      const lon = el.lon != null ? el.lon : (el.center && el.center.lon);
      if (lat == null || lon == null) continue;

      let code;
      if (t.railway === 'station' || t.railway === 'halt') code = 'g';
      else if (t.railway === 'tram_stop') code = 't';
      else if (t.highway === 'bus_stop') code = 'b';
      else continue;

      items.push({ code: code, lat: lat, lon: lon, name: t.name || t['name:fr'] || '' });
    }

    // Une gare peut être cartographiée à la fois en point et en bâtiment : on évite les doublons
    const gares = [];
    const kept = items.filter((it) => {
      if (it.code !== 'g' || !it.name) return true;
      const dup = gares.some((g) => g.name.toLowerCase() === it.name.toLowerCase() &&
        distanceM(g.lat, g.lon, it.lat, it.lon) < 250);
      if (!dup) gares.push(it);
      return !dup;
    });
    return kept.map((it) => [it.code, +it.lat.toFixed(6), +it.lon.toFixed(6), it.name]);
  }

  /* ---- Préchargement de tous les établissements (bouton en bas à droite) ---- */
  const prefetchEl = L.DomUtil.create('div', 'panel prefetch');
  prefetchEl.innerHTML = '<button type="button" class="pf-btn">⚡ Précharger les transports</button>' +
    '<div class="pf-status hint"></div>';
  const PrefetchControl = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd: function () {
      L.DomEvent.disableClickPropagation(prefetchEl);
      return prefetchEl;
    }
  });
  map.addControl(new PrefetchControl());
  const pfBtn = prefetchEl.querySelector('.pf-btn');
  const pfStatus = prefetchEl.querySelector('.pf-status');

  let prefetching = false, prefetchAbort = null, pfMessage = '';

  function updatePrefetchUI() {
    if (prefetching) return;
    const total = schoolsUnique.length;
    const cached = schoolsUnique.filter((s) => cache.has(cacheKey(s.lat, s.lng))).length;
    pfBtn.textContent = '⚡ Précharger les transports';
    pfBtn.disabled = !total || cached === total;
    pfStatus.textContent = pfMessage ||
      (total ? cached + ' / ' + total + ' établissements en cache' : '') +
      (gristCacheOk || !total ? '' : ' — NON enregistré dans Grist (mémoire seulement)' +
        (cacheError ? ' : ' + cacheError : ''));
  }

  async function prefetchAll() {
    if (prefetching) { prefetchAbort.abort(); return; }
    await cacheReady;
    const todo = schoolsUnique.filter((s) => !cache.has(cacheKey(s.lat, s.lng)));
    if (!todo.length) { updatePrefetchUI(); return; }

    prefetching = true;
    prefetchAbort = new AbortController();
    pfMessage = '';
    pfBtn.textContent = '■ Arrêter';
    let done = 0, failed = 0;
    pfStatus.textContent = '0 / ' + todo.length + ' …';

    let lastErr = '';

    // Interroge un groupe ; en cas d'échec, le coupe en deux et réessaie (jusqu'à l'établissement seul)
    async function doChunk(chunk) {
      try {
        const elements = await queryOverpass(
          chunk.map((s) => [s.lat, s.lng]), prefetchAbort.signal, PREFETCH_TIMEOUT_MS);
        const items = parseElements(elements);
        await persist(chunk.map((s) => [
          cacheKey(s.lat, s.lng),
          items.filter((it) => distanceM(s.lat, s.lng, it[1], it[2]) <= RADIUS_M)
        ]));
        done += chunk.length;
      } catch (e) {
        if (prefetchAbort.signal.aborted) throw abortError();
        if (chunk.length > 1) {
          const mid = Math.ceil(chunk.length / 2);
          await doChunk(chunk.slice(0, mid));
          await doChunk(chunk.slice(mid));
          return;
        }
        failed++; done++;
        lastErr = (e && e.message) || 'erreur';
      }
      pfStatus.textContent = done + ' / ' + todo.length + ' …';
    }

    try {
      for (let i = 0; i < todo.length; i += PREFETCH_CHUNK) {
        await doChunk(todo.slice(i, i + PREFETCH_CHUNK));
        await new Promise((r) => setTimeout(r, 400)); // ménage les serveurs Overpass publics
      }
      pfMessage = failed
        ? (failed + ' établissement(s) non chargés (' + lastErr + '), relancez pour réessayer')
        : '';
    } catch (e) {
      pfMessage = prefetchAbort.signal.aborted ? 'Préchargement arrêté' : ('Erreur : ' + ((e && e.message) || e));
    } finally {
      prefetching = false;
      updatePrefetchUI();
      pfMessage = '';
    }
  }
  pfBtn.addEventListener('click', prefetchAll);


  function transportIcon(kind) {
    return L.divIcon({
      className: '',
      html: '<div class="tp tp-' + kind + '">' + (kind === 'gare' ? '🚂' : '🚌') + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
      popupAnchor: [0, -13],
      tooltipAnchor: [0, -13]
    });
  }

  function drawTransport(items, s, fromCache) {
    transportLayer.clearLayers();

    const kept = items.map((a) => ({
      kind: a[0] === 'g' ? 'gare' : 'bus',
      label: a[0] === 'g' ? 'Gare' : (a[0] === 't' ? 'Arrêt de tram' : 'Arrêt de bus'),
      lat: a[1], lon: a[2], name: a[3]
    }));


    let nGares = 0, nArrets = 0;
    for (const it of kept) {
      if (it.kind === 'gare') nGares++; else nArrets++;
      const d = Math.round(distanceM(s.lat, s.lng, it.lat, it.lon) / 10) * 10;
      const title = it.name || (it.kind === 'gare' ? 'Gare sans nom' : 'Arrêt sans nom');
      const marker = L.marker([it.lat, it.lon], {
        icon: transportIcon(it.kind),
        zIndexOffset: it.kind === 'gare' ? 500 : 0
      });
      marker.bindTooltip(esc(title), { direction: 'top' });
      marker.bindPopup(
        '<b>' + esc(title) + '</b><br>' +
        '<span class="sub">' + esc(it.label) + ' · à ' + d + '&nbsp;m de l’établissement</span>'
      );
      marker.addTo(transportLayer);
    }

    const cat = classify(s.type);
    const plural = (n, one, many) => n + '&nbsp;' + (n > 1 ? many : one);
    setInfo(
      '<div class="nom">' + esc(s.nom || 'Sans nom') + '</div>' +
      '<div class="hint">' + esc(CATS[cat].label) + '</div>' +
      '<div>🚂 ' + plural(nGares, 'gare', 'gares') + ' · 🚌 ' + plural(nArrets, 'arrêt', 'arrêts') +
      ' <span class="hint">dans ' + (RADIUS_M / 1000) + '&nbsp;km' + (fromCache ? ' · ⚡ en cache' : '') + '</span></div>'
    );
  }

  /* ------------------------------------------------------------------ *
   *  Connexion à Grist
   * ------------------------------------------------------------------ */
  function mapRow(rec) {
    const m = grist.mapColumnNames(rec);
    if (!m) return null;
    const lat = toNum(m.lat), lng = toNum(m.lng);
    if (!isFinite(lat) || !isFinite(lng)) return { invalid: true };
    return { id: rec.id, type: m.type, nom: m.nom, lat: lat, lng: lng };
  }

  if (typeof grist === 'undefined') {
    setInfo('<span class="err">Ce widget doit être ouvert depuis Grist (widget personnalisé).</span>');
    return;
  }

  setInfoIdle();
  cacheReady = initCache();

  grist.ready({
    requiredAccess: 'full', // nécessaire pour lire/écrire la table de cache
    columns: [
      { name: 'type', title: 'Type d’établissement (colonne G)', type: 'Text,Choice' },
      { name: 'nom',  title: 'Nom', type: 'Text,Choice', optional: true },
      { name: 'lat',  title: 'Latitude', type: 'Numeric,Text' },
      { name: 'lng',  title: 'Longitude', type: 'Numeric,Text' }
    ]
  });

  grist.onRecords(function (records) {
    if (!records) return;
    const rows = [];
    for (const rec of records) {
      const r = mapRow(rec);
      if (r && !r.invalid) rows.push(r);
    }
    renderSchools(rows);
  });

  grist.onRecord(function (rec) {
    if (!rec) return;
    const r = mapRow(rec);
    if (!r) {
      setInfo('<span class="err">Associez les colonnes dans le panneau de configuration du widget.</span>');
      return;
    }
    if (r.invalid) {
      setInfo('<span class="err">Cette ligne n’a pas de coordonnées valides.</span>');
      return;
    }
    focusOn(r);
  });
})();
</script>
</body>
</html>
